<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Internal Services</title>
    <!--
      Generated by the container entrypoint from the mounted /config/services.yaml.
      In local development, public/config/services.js (a checked-in stub) is served instead.
      Must be a classic script: it runs before any module script, so
      window.__SERVICES__ is guaranteed to exist when main.ts executes.
    -->
    <script src="/config/services.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main id="app" class="app"></main>
  </body>
</html>
